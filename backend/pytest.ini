[pytest]
# Diretório de testes
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py

# Opções padrão
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=api
    --cov=services
    --cov=models
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
    --cov-report=xml:tests/coverage.xml
    --cov-fail-under=70

# Marcadores personalizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    auth: Testes relacionados à autenticação
    slow: Testes lentos

# Variáveis de ambiente (set in tests/conftest.py to ensure they are
# available before config modules are imported)

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning:flask
    ignore::UserWarning
